services:
  e_voice_kit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e_voice_kit
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: e_voice_kit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voice_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
